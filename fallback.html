
<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0b0b">
  <title>Spektrum Bajlando — Basen AR</title>

  <script type="module"
    src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
  </script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      color: white;
      background: #0b0b0b;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    header {
      flex: 0 0 auto;
      text-align: center;
      padding: 12px 10px;
    }

    h1 {
      margin: 0 0 4px;
      font-size: 23px;
    }

    header p {
      margin: 0 0 10px;
      font-size: 14px;
      opacity: .85;
    }

    .radio-button {
      border: 0;
      border-radius: 999px;
      padding: 12px 20px;
      background: #ffcf52;
      color: #17120a;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
    }

    .radio-button:active {
      transform: scale(.97);
    }

    #status {
      font-size: 12px;
      min-height: 16px;
      margin-top: 6px;
      opacity: .8;
    }

    model-viewer {
      display: block;
      width: 100%;
      flex: 1 1 auto;
      min-height: 0;
      background: #111;
      position: relative;
    }

    .ar-button {
      position: absolute;
      left: 50%;
      bottom: 22px;
      transform: translateX(-50%);
      border: 0;
      border-radius: 999px;
      padding: 16px 25px;
      background: white;
      color: #111;
      font-size: 17px;
      font-weight: 800;
      white-space: nowrap;
      box-shadow: 0 4px 18px #0008;
      cursor: pointer;
    }

    footer {
      flex: 0 0 auto;
      padding: 7px 10px;
      text-align: center;
      font-size: 12px;
      opacity: .75;
    }
  </style>
</head>

<body>
  <header>
    <h1>🏊 Spektrum Bajlando</h1>
    <p>Inkluzywne wczasy dla każdego!</p>

    <button id="radio" class="radio-button" type="button">
      📻 RADIO WAKAJKI ▶
    </button>
    <div id="status">Włącz wakacyjny klimat 🎶</div>
  </header>

  <audio id="music"
    src="./assets/AllInclusive_SpektrumBajlando.mp3"
    preload="auto"
    loop>
  </audio>

  <model-viewer
    id="basen"
    src="./assets/model.glb"
    alt="Model basenu Spektrum Bajlando"
    camera-controls
    shadow-intensity="1"
    exposure="0.9"
    ar
    ar-modes="webxr scene-viewer quick-look"
    ar-scale="auto"
    ar-placement="floor"
    xr-environment>

    <button slot="ar-button" class="ar-button" type="button">
      📱 URUCHOM AR 🏊
    </button>

  </model-viewer>

  <footer>
    Zeskanuj. Wypocznij. Posłuchaj. 🍹
  </footer>

  <script>
    const music = document.getElementById('music');
    const radio = document.getElementById('radio');
    const status = document.getElementById('status');

    radio.addEventListener('click', async () => {
      if (!music.paused) {
        music.pause();
        radio.textContent = '📻 RADIO WAKAJKI ▶';
        status.textContent = 'Radio wyłączone. Cisza przy basenie 😎';
        return;
      }

      try {
        await music.play();
        radio.textContent = '⏸ RADIO WAKAJKI';
        status.textContent = '🔊 Nadajemy wakacyjnie!';
      } catch (error) {
        status.textContent =
          'Nie udało się odtworzyć. Spróbuj kliknąć ponownie.';
      }
    });

    music.addEventListener('ended', () => {
      radio.textContent = '📻 RADIO WAKAJKI ▶';
    });
  </script>
</body>
</html>
