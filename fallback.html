<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Basen AR</title>

    <script type="module"
      src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
    </script>

    <style>
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        background: #0b0b0b;
        color: white;
      }

      header {
        padding: 16px;
        text-align: center;
      }

      h1 {
        margin: 0 0 6px;
      }

      p {
        margin: 0;
        opacity: .8;
      }

      model-viewer {
        width: 100vw;
        height: calc(100vh - 110px);
        background: #111;
      }
    </style>
  </head>

  <body>

    <header>
      <h1>🏊 Basen</h1>
      <p>Obejrzyj model lub umieść go w swojej przestrzeni.</p>
    </header>

    <model-viewer
      src="./assets/model.glb"
      alt="Model basenu"
      camera-controls
      shadow-intensity="1"
      exposure="0.9"
      ar
      ar-modes="webxr scene-viewer quick-look"
      ar-scale="auto"
      ar-placement="floor"
      xr-environment>
    </model-viewer>

  </body>
</html>
